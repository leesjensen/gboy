name: Deploy Static Content
on:
  push:
    branches: ['main'] # Trigger the workflow on every push to the main branch
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          # Fail instead of deploying a site that can't reach the recipe database.
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is not set. Add it as a repository variable under Settings > Secrets and variables > Actions > Variables."; exit 1; }
          done
          npm run build # The built site `dist` directory
        env:
          # Repository variables; the anon key is public, and RLS protects the data.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.set_version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh release create "version-$VERSION" \
            --title "Version $VERSION" \
            --notes "Deployed to $PAGE_URL. Source: $SOURCE_SHA" \
            --target "$SOURCE_SHA" \
            --latest \
            --generate-notes
